<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff176;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffca28;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <clipPath id="roundClip">
      <rect width="600" height="420" rx="20"/>
    </clipPath>
  </defs>
  
  <!-- Background sky -->
  <rect width="600" height="420" fill="url(#skyGrad)" rx="20"/>
  
  <!-- Distant rolling hills -->
  <ellipse cx="100" cy="260" rx="180" ry="60" fill="#a5d6a7" opacity="0.5"/>
  <ellipse cx="500" cy="270" rx="160" ry="55" fill="#a5d6a7" opacity="0.4"/>
  <ellipse cx="300" cy="250" rx="200" ry="70" fill="#81c784" opacity="0.5"/>
  
  <!-- River winding across the scene -->
  <path d="M 0 310 Q 80 290 160 310 Q 240 330 320 305 Q 400 280 480 310 Q 540 325 600 310 L600 420 L0 420 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <!-- River shimmer lines -->
  <path d="M 30 315 Q 90 305 150 315" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 220 308 Q 280 295 340 308" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 420 310 Q 480 298 540 310" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Paddy field strips (left bank) -->
  <path d="M 0 280 Q 60 260 120 275 L 120 340 Q 60 325 0 340 Z" fill="#66bb6a" opacity="0.85"/>
  <path d="M 120 275 Q 180 255 240 270 L 240 335 Q 180 320 120 340 Z" fill="#4caf50" opacity="0.8"/>
  <!-- Field rows (dotted lines to simulate paddy) -->
  <line x1="5" y1="290" x2="110" y2="283" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  <line x1="5" y1="300" x2="110" y2="295" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  <line x1="5" y1="310" x2="110" y2="307" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  <line x1="5" y1="320" x2="110" y2="319" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  <line x1="125" y1="285" x2="232" y2="278" stroke="#1b5e20" stroke-width="0.8" opacity="0.5"/>
  <line x1="125" y1="295" x2="232" y2="292" stroke="#1b5e20" stroke-width="0.8" opacity="0.5"/>
  <line x1="125" y1="307" x2="232" y2="306" stroke="#1b5e20" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Paddy field (right side) -->
  <path d="M 360 280 Q 430 260 500 275 L 500 340 Q 430 325 360 340 Z" fill="#66bb6a" opacity="0.8"/>
  <path d="M 500 275 Q 560 260 600 270 L 600 340 Q 560 328 500 340 Z" fill="#4caf50" opacity="0.75"/>
  <line x1="368" y1="290" x2="495" y2="283" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  <line x1="368" y1="300" x2="495" y2="295" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  <line x1="368" y1="310" x2="495" y2="308" stroke="#2e7d32" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Traditional mud house (kha ঘর) -->
  <rect x="255" y="228" width="90" height="58" rx="4" fill="#8d6e63"/>
  <polygon points="250,228 300,195 350,228" fill="#5d4037"/>
  <!-- Door -->
  <rect x="288" y="263" width="24" height="23" rx="3" fill="#4e342e"/>
  <!-- Windows -->
  <rect x="260" y="238" width="20" height="14" rx="2" fill="#90caf9" opacity="0.8"/>
  <rect x="320" y="238" width="20" height="14" rx="2" fill="#90caf9" opacity="0.8"/>
  <!-- Thatch roof texture -->
  <path d="M 250 228 Q 300 215 350 228" stroke="#795548" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 255 224 Q 300 210 345 224" stroke="#6d4c41" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- Palm / Coconut trees -->
  <!-- Tree 1 -->
  <rect x="145" y="230" width="6" height="55" rx="2" fill="#8d6e63"/>
  <ellipse cx="148" cy="225" rx="22" ry="12" fill="#2e7d32" opacity="0.85"/>
  <ellipse cx="130" cy="220" rx="18" ry="9" fill="#388e3c" opacity="0.8" transform="rotate(-20 130 220)"/>
  <ellipse cx="165" cy="222" rx="18" ry="9" fill="#388e3c" opacity="0.8" transform="rotate(20 165 222)"/>
  <!-- Tree 2 -->
  <rect x="450" y="225" width="6" height="60" rx="2" fill="#8d6e63"/>
  <ellipse cx="453" cy="220" rx="24" ry="12" fill="#2e7d32" opacity="0.85"/>
  <ellipse cx="435" cy="216" rx="18" ry="9" fill="#388e3c" opacity="0.8" transform="rotate(-20 435 216)"/>
  <ellipse cx="470" cy="218" rx="18" ry="9" fill="#388e3c" opacity="0.8" transform="rotate(20 470 218)"/>
  
  <!-- Sun -->
  <circle cx="540" cy="75" r="38" fill="url(#sunGrad)" opacity="0.75"/>
  <!-- Sun rays -->
  <line x1="540" y1="25" x2="540" y2="10" stroke="#ffca28" stroke-width="3" opacity="0.5"/>
  <line x1="578" y1="47" x2="592" y2="38" stroke="#ffca28" stroke-width="3" opacity="0.5"/>
  <line x1="592" y1="88" x2="600" y2="90" stroke="#ffca28" stroke-width="2" opacity="0.5"/>
  <line x1="502" y1="47" x2="490" y2="38" stroke="#ffca28" stroke-width="3" opacity="0.5"/>
  
  <!-- Birds in sky -->
  <path d="M 80 80 Q 87 74 94 80" stroke="#546e7a" stroke-width="2" fill="none"/>
  <path d="M 100 68 Q 108 62 116 68" stroke="#546e7a" stroke-width="2" fill="none"/>
  <path d="M 180 55 Q 188 49 196 55" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  
  <!-- Digital overlay elements (representing land digitization) -->
  <!-- QR code style square in corner with glassy panel -->
  <rect x="20" y="20" width="95" height="82" rx="12" fill="white" opacity="0.88" filter="url(#shadow)"/>
  <!-- Miniature QR grid -->
  <rect x="30" y="30" width="12" height="12" rx="1" fill="#1a6b3c"/>
  <rect x="44" y="30" width="4" height="4" fill="#1a6b3c"/>
  <rect x="50" y="30" width="4" height="4" fill="#1a6b3c"/>
  <rect x="56" y="30" width="8" height="8" fill="#1a6b3c" rx="1"/>
  <rect x="30" y="44" width="4" height="4" fill="#1a6b3c"/>
  <rect x="36" y="44" width="4" height="8" fill="#1a6b3c"/>
  <rect x="44" y="44" width="8" height="4" fill="#1a6b3c"/>
  <rect x="56" y="44" width="4" height="4" fill="#1a6b3c"/>
  <rect x="30" y="50" width="12" height="12" rx="1" fill="#1a6b3c"/>
  <rect x="56" y="50" width="8" height="8" rx="1" fill="#1a6b3c"/>
  <rect x="44" y="52" width="4" height="8" fill="#1a6b3c"/>
  <text x="30" y="78" font-family="Inter, sans-serif" font-size="8" fill="#065f46" font-weight="700">QR ডিজিটাল</text>
  <text x="30" y="89" font-family="Inter, sans-serif" font-size="7" fill="#047857">খতিয়ান যাচাই</text>
  
  <!-- SHA-256 shield badge -->
  <rect x="490" y="155" width="100" height="65" rx="12" fill="white" opacity="0.88" filter="url(#shadow)"/>
  <!-- Shield icon -->
  <path d="M 530 165 L 545 165 L 550 185 L 537.5 193 L 525 185 Z" fill="#1a6b3c" opacity="0.85"/>
  <text x="530" y="178" font-family="monospace" font-size="7" fill="white" text-anchor="middle" font-weight="800">SHA</text>
  <text x="530" y="187" font-family="monospace" font-size="6" fill="white" text-anchor="middle">256</text>
  <text x="540" y="208" font-family="Inter, sans-serif" font-size="8" fill="#065f46" font-weight="700" text-anchor="middle">ক্রিপ্টো সুরক্ষা</text>
  <text x="540" y="218" font-family="Inter, sans-serif" font-size="7" fill="#047857" text-anchor="middle">জাল দলিল রোধ</text>
  
  <!-- Coordinate/GPS marker on land -->
  <circle cx="298" cy="298" r="10" fill="#e53935" opacity="0.85"/>
  <circle cx="298" cy="298" r="5" fill="white"/>
  <line x1="298" y1="288" x2="298" y2="270" stroke="#e53935" stroke-width="2"/>
  <!-- Pin tooltip -->
  <rect x="255" y="254" width="90" height="28" rx="8" fill="white" opacity="0.9" filter="url(#shadow)"/>
  <text x="300" y="266" font-family="Inter, sans-serif" font-size="8" fill="#065f46" font-weight="700" text-anchor="middle">দাগ নং: ১৪৩</text>
  <text x="300" y="277" font-family="Inter, sans-serif" font-size="7" fill="#0369a1" text-anchor="middle">মৌজা: শিবগঞ্জ</text>
  
  <!-- Bottom: Bangladesh landscape label -->
  <rect x="0" y="385" width="600" height="35" rx="0" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="407" font-family="Inter, Hind Siliguri, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="700">
    বাংলাদেশের নদীমাতৃক ভূমি — ডিজিটাল কাদাস্ট্রাল ম্যাপিং
  </text>
</svg>

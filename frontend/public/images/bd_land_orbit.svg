<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Circular background -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" opacity="0.4"/>
  <circle cx="250" cy="250" r="240" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3" stroke-dasharray="8 6"/>
  
  <!-- Outer ring with dots -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#16a34a" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Center: Main land parcel icon -->
  <!-- Land plot with grid -->
  <rect x="175" y="175" width="150" height="150" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="225" y1="175" x2="225" y2="325" stroke="#86efac" stroke-width="1"/>
  <line x1="275" y1="175" x2="275" y2="325" stroke="#86efac" stroke-width="1"/>
  <line x1="175" y1="225" x2="325" y2="225" stroke="#86efac" stroke-width="1"/>
  <line x1="175" y1="275" x2="325" y2="275" stroke="#86efac" stroke-width="1"/>
  <!-- Map pin in center -->
  <circle cx="250" cy="250" r="22" fill="#16a34a" opacity="0.9"/>
  <circle cx="250" cy="247" r="10" fill="white"/>
  <path d="M 250 250 L 244 265 Q 250 272 256 265 Z" fill="#16a34a"/>
  <!-- Corner markers -->
  <circle cx="175" cy="175" r="5" fill="#065f46"/>
  <circle cx="325" cy="175" r="5" fill="#065f46"/>
  <circle cx="175" cy="325" r="5" fill="#065f46"/>
  <circle cx="325" cy="325" r="5" fill="#065f46"/>
  
  <!-- Orbit icons: QR, Shield, Doc, Cloud, NID -->
  
  <!-- QR Code icon (top) -->
  <circle cx="250" cy="42" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="232" y="24" width="8" height="8" rx="1" fill="#065f46"/>
  <rect x="242" y="24" width="4" height="4" fill="#065f46"/>
  <rect x="248" y="24" width="4" height="4" fill="#065f46"/>
  <rect x="254" y="24" width="8" height="8" rx="1" fill="#065f46"/>
  <rect x="232" y="34" width="4" height="4" fill="#065f46"/>
  <rect x="238" y="34" width="4" height="8" fill="#065f46"/>
  <rect x="254" y="34" width="4" height="4" fill="#065f46"/>
  <rect x="232" y="40" width="8" height="8" rx="1" fill="#065f46"/>
  <rect x="254" y="40" width="8" height="8" rx="1" fill="#065f46"/>
  <text x="250" y="66" font-family="Inter, sans-serif" font-size="7.5" fill="#065f46" font-weight="700" text-anchor="middle">QR খতিয়ান</text>
  
  <!-- Shield icon (top-right) -->
  <circle cx="440" cy="130" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <path d="M 440 112 L 458 112 L 458 138 L 440 148 L 422 138 L 422 112 Z" fill="#1a6b3c" opacity="0.9"/>
  <text x="440" y="128" font-family="monospace" font-size="8" fill="white" text-anchor="middle" font-weight="700">SHA</text>
  <text x="440" y="138" font-family="monospace" font-size="7" fill="#86efac" text-anchor="middle">256</text>
  <text x="440" y="154" font-family="Inter, sans-serif" font-size="7.5" fill="#065f46" font-weight="700" text-anchor="middle">ক্রিপ্টো</text>
  
  <!-- Document icon (right) -->
  <circle cx="462" cy="250" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="447" y="230" width="30" height="36" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="447" y="230" width="20" height="8" rx="2" fill="#3b82f6" opacity="0.7"/>
  <line x1="452" y1="246" x2="472" y2="246" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="452" y1="252" x2="472" y2="252" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="452" y1="258" x2="468" y2="258" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="462" y="278" font-family="Inter, sans-serif" font-size="7.5" fill="#0369a1" font-weight="700" text-anchor="middle">দলিল নিবন্ধন</text>
  
  <!-- Cloud DB icon (bottom-right) -->
  <circle cx="440" cy="370" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <ellipse cx="440" cy="360" rx="16" ry="10" fill="#f59e0b" opacity="0.85"/>
  <ellipse cx="430" cy="362" rx="10" ry="8" fill="#fbbf24" opacity="0.8"/>
  <ellipse cx="450" cy="362" rx="10" ry="8" fill="#fbbf24" opacity="0.8"/>
  <ellipse cx="440" cy="367" rx="18" ry="6" fill="#d97706" opacity="0.75"/>
  <text x="440" y="390" font-family="Inter, sans-serif" font-size="7.5" fill="#92400e" font-weight="700" text-anchor="middle">ক্লাউড ডেটাবেস</text>
  
  <!-- NID card icon (bottom-left) -->
  <circle cx="60" cy="370" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="40" y="352" width="40" height="26" rx="4" fill="#7c3aed" opacity="0.8"/>
  <circle cx="52" cy="362" r="6" fill="white" opacity="0.7"/>
  <line x1="62" y1="358" x2="76" y2="358" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="62" y1="363" x2="74" y2="363" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="62" y1="368" x2="72" y2="368" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <text x="60" y="390" font-family="Inter, sans-serif" font-size="7.5" fill="#6d28d9" font-weight="700" text-anchor="middle">NID যাচাই</text>
  
  <!-- Email icon (left) -->
  <circle cx="38" cy="250" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="20" y="236" width="36" height="24" rx="4" fill="#10b981" opacity="0.85"/>
  <path d="M 20 238 L 38 250 L 56 238" stroke="white" stroke-width="2" fill="none"/>
  <text x="38" y="274" font-family="Inter, sans-serif" font-size="7.5" fill="#047857" font-weight="700" text-anchor="middle">ইমেইল OTP</text>
  
  <!-- Connecting lines from center to orbit icons -->
  <line x1="250" y1="175" x2="250" y2="78" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="317" y1="200" x2="413" y2="148" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="325" y1="250" x2="428" y2="250" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="317" y1="300" x2="413" y2="350" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="183" y1="300" x2="87" y2="350" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="175" y1="250" x2="72" y2="250" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  
  <!-- Top-left icon (AC Land) -->
  <circle cx="60" cy="130" r="34" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <text x="60" y="118" font-size="22" text-anchor="middle" dominant-baseline="middle">⚖️</text>
  <text x="60" y="140" font-family="Inter, sans-serif" font-size="7" fill="#b45309" font-weight="700" text-anchor="middle">এসি ল্যান্ড</text>
  <text x="60" y="149" font-family="Inter, sans-serif" font-size="6.5" fill="#92400e" text-anchor="middle">অনুমোদন</text>
  <line x1="183" y1="200" x2="87" y2="148" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  
  <!-- Center text -->
  <text x="250" y="343" font-family="Hind Siliguri, Inter, sans-serif" font-size="9" fill="#065f46" font-weight="800" text-anchor="middle">e-ভূমি নেটওয়ার্ক</text>
</svg>
